repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict

  - repo: local
    hooks:
      # Every Verdict and every Coverage value must still occur, and both deliberately broken rows
      # must still be reported. A missing enum value makes the assertions about it vacuous rather
      # than failing, which is the quiet way a corpus stops testing anything.
      - id: corpus-produces-every-outcome
        name: every verdict and coverage value still occurs in the corpus
        entry: >
          python -c "import sys; sys.path.insert(0, 'src');
          from datetime import datetime; from pathlib import Path; from zoneinfo import ZoneInfo;
          from sla_watch.measure import build_report;
          from sla_watch.models import Coverage, Verdict;
          from sla_watch.tickets import load_tickets, resolve_regions;
          t, p = load_tickets(Path('data/tickets.jsonl'));
          assert len(p) == 2, f'expected exactly 2 planted bad rows, got {len(p)}: {p}';
          r = build_report(t, resolve_regions(t), datetime(2026, 6, 15, 12, 0, tzinfo=ZoneInfo('UTC')), tuple(p));
          mv = {v.value for v in Verdict} - set(r.counts);
          assert not mv, f'corpus never produces verdicts: {sorted(mv)}';
          mc = set(Coverage) - {s.coverage for s in r.regions};
          assert not mc, f'corpus never produces coverage: {sorted(c.value for c in mc)}';
          assert r.regions_looking_perfect, 'no region reports full compliance with a long wait';
          assert r.compliance < 1.0, 'the fleet figure must differ from the per-region ones';
          print(f'{len(t)} tickets, all 6 verdicts and all 4 coverage values present')"
        language: system
        pass_filenames: false
        files: ^data/
